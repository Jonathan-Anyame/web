<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Illustration of a steaming mug">
<style>
.steam{fill:none;stroke:#F2EFE8;stroke-width:10;stroke-linecap:round;opacity:.55;animation:rise 4s ease-in-out infinite}
.s2{animation-delay:1.3s} .s3{animation-delay:2.6s}
@keyframes rise{0%{transform:translateY(14px);opacity:0}40%{opacity:.6}100%{transform:translateY(-14px);opacity:0}}
@media (prefers-reduced-motion:reduce){.steam{animation:none;opacity:.5}}
</style>
<rect width="600" height="600" rx="40" fill="#E9B64B"/>
<circle cx="300" cy="330" r="230" fill="#F2C86B"/>
<path class="steam" d="M240 190c-24-28 24-48 0-80"/>
<path class="steam s2" d="M300 180c-24-28 24-48 0-80"/>
<path class="steam s3" d="M360 190c-24-28 24-48 0-80"/>
<path d="M170 260h260v120c0 66-52 110-130 110s-130-44-130-110z" fill="#22332D"/>
<path d="M430 290h30c36 0 36 80 0 80h-34" fill="none" stroke="#22332D" stroke-width="26" stroke-linecap="round"/>
<ellipse cx="300" cy="260" rx="130" ry="22" fill="#182420"/>
<ellipse cx="300" cy="262" rx="108" ry="14" fill="#B4563B"/>
<path d="M232 340h136M250 380h100" stroke="#F2EFE8" stroke-width="8" stroke-linecap="round" opacity=".8"/>
<ellipse cx="300" cy="512" rx="190" ry="16" fill="#22332D" opacity=".25"/>
</svg>